name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hackathon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hackathon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/hackathon_test
      REDIS_URL: redis://localhost:6379/0

      ANTHROPIC_API_KEY: ci-test-key
      OPENAI_API_KEY: ci-test-key

      GITHUB_TOKEN: ci-test-token
      GITHUB_WEBHOOK_SECRET: ci-test-secret

      CLERK_SECRET_KEY: ci-test-key
      CLERK_PUBLISHABLE_KEY: ci-test-key
      CLERK_JWT_VERIFICATION_KEY: ci-test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e . || true
          pip install \
            pytest \
            pytest-asyncio \
            pytest-cov \
            fastapi \
            uvicorn \
            pydantic \
            pydantic-settings \
            sqlalchemy \
            asyncpg \
            redis \
            httpx

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/app
        run: |
          pytest tests -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        